- name: Extract & Auto-Crop Icon (Python)
        run: |
          pip install pillow --quiet

          python3 - << 'EOF'
          import zipfile, re, os
          from PIL import Image

          apk_path = "${{ env.apk_path }}"
          print(f"Inspecting APK at: {apk_path}")

          with zipfile.ZipFile(apk_path, 'r') as z:
              names = z.namelist()

              candidates = [n for n in names if re.search(r'^res/(mipmap|drawable).*\.(png|webp|jpg)$', n, re.I)]
              candidates = [n for n in candidates if 'background' not in n.lower()]

              best = [n for n in candidates if any(k in n.lower() for k in ['launcher', 'icon', 'logo', 'app'])]
              if not best:
                  best = candidates

              if best:
                  def priority(name):
                      score = 0
                      if 'xxxhdpi' in name: score += 50
                      elif 'xxhdpi' in name: score += 40
                      elif 'xhdpi' in name: score += 30
                      elif 'hdpi' in name: score += 20
                      elif 'mdpi' in name: score += 10
                      if 'foreground' not in name: score += 5
                      return score

                  best.sort(key=priority, reverse=True)
                  chosen = best[0]
                  print(f"Extracting selected icon: {chosen}")

                  with open("temp_raw_icon", "wb") as f:
                      f.write(z.read(chosen))

                  try:
                      with Image.open("temp_raw_icon") as img:
                          img = img.convert("RGBA")
                          alpha = img.split()[-1]
                          
                          # סינון קפדני: מתעלם לחלוטין מצלליות חלשות (שומר רק תוכן מוצק מעל 200)
                          mask = alpha.point(lambda p: 255 if p > 200 else 0)
                          bbox = mask.getbbox()

                          # גיבוי אם התמונה אינה מוצקת לגמרי
                          if not bbox:
                              mask = alpha.point(lambda p: 255 if p > 60 else 0)
                              bbox = mask.getbbox()

                          if bbox:
                              cropped = img.crop(bbox)
                              
                              # מתיחה ישירה לגודל 512x512 מלא ללא שוליים
                              final_icon = cropped.resize((512, 512), Image.Resampling.LANCZOS)
                              final_icon.save("icon.png", "PNG")
                              print(f"Tight crop succeeded! Bbox: {bbox} -> Resized to full 512x512")
                          else:
                              img.resize((512, 512), Image.Resampling.LANCZOS).save("icon.png", "PNG")
                  except Exception as e:
                      print(f"Image processing error: {e}, using original image")
                      os.rename("temp_raw_icon", "icon.png")

                  if os.path.exists("temp_raw_icon"):
                      os.remove("temp_raw_icon")
                      
                  print("Saved icon.png successfully!")
              else:
                  print("No suitable icon image found in APK.")
          EOF
